workflows:
  ios-unsigned-ipa:
    name: CarWithin unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      python: 3.11
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Unzip source
        script: |
          mkdir -p src
          unzip -q CarWithin-src.zip -d src
          ls src
      - name: Generate Xcode project
        script: |
          cd src
          python3 Tools/generate_project.py
      - name: Build arm64 app
        script: |
          cd src
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R src/build/Build/Products/Release-iphoneos/TDSCarKit.app Payload/
          zip -qry CarWithin-1.0.5-handlebar-unsigned.ipa Payload
    artifacts:
      - CarWithin-1.0.5-handlebar-unsigned.ipa
